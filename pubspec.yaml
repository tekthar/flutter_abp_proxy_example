name: flutter_abp_proxy_example
description: "Minimal quickstart showing how to use flutter_abp_proxy to generate Retrofit services and Freezed models from an ABP backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking layer generated by flutter_abp_proxy
  dio: ^5.9.0
  retrofit: ^4.9.2
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation stack required by flutter_abp_proxy output (freezed v3)
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.3

flutter:
  uses-material-design: true
